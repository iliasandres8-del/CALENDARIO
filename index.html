<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Canchas Carnaval</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%230F6E56'/><circle cx='20' cy='20' r='13' fill='%23fff'/><polygon points='20,13 23.8,15.8 22.4,20.2 17.6,20.2 16.2,15.8' fill='%231a1a1a'/><polygon points='14,11 17.2,13.2 16.2,16.8 12,16.8 10.8,13' fill='%231a1a1a'/><polygon points='26,11 29.2,13 28,16.8 23.8,16.8 22.8,13.2' fill='%231a1a1a'/><polygon points='10.5,21.5 12,17 16,17.2 17.5,21.5 14,24.5' fill='%231a1a1a'/><polygon points='29.5,21.5 26,24.5 22.5,21.5 24,17.2 28,17' fill='%231a1a1a'/><polygon points='14,24.8 17.5,22 22.5,22 26,24.8 23.5,29 16.5,29' fill='%231a1a1a'/></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }

.header { background: #0F6E56; padding: 16px 20px; }
.header-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.header-title { font-size: 20px; font-weight: 600; color: #fff; }
.header-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 1px; }
.header-btns { display: flex; gap: 6px; }
.tab-btn { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: inherit; }
.tab-btn.active { background: #fff; color: #0F6E56; }
.tab-btn.inactive { background: rgba(255,255,255,0.15); color: #fff; }

.view { display: none; }
.view.active { display: block; }

.cliente-wrap { max-width: 700px; margin: 0 auto; padding: 0 14px 48px; }
.cal-nav { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px; }
.nav-btn { background: none; border: 1px solid #d0d0cc; border-radius: 7px; padding: 5px 14px; cursor: pointer; font-size: 18px; color: #555; }
.cal-mes { font-size: 13px; font-weight: 500; color: #666; }
.dias-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
.dia-cell { border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; border: 1.5px solid #e0e0e0; background: #f5f5f3; transition: all 0.15s; }
.dia-cell.hoy { background: #E1F5EE; border-color: #1D9E75; }
.dia-cell.sel { background: #0F6E56; border-color: #0F6E56; }
.dia-dow { font-size: 10px; font-weight: 500; color: #999; margin-bottom: 2px; }
.dia-cell.sel .dia-dow { color: rgba(255,255,255,0.8); }
.dia-cell.hoy .dia-dow { color: #0F6E56; }
.dia-num { font-size: 15px; font-weight: 500; color: #1a1a1a; }
.dia-cell.sel .dia-num { color: #fff; }
.dia-cell.hoy .dia-num { color: #0F6E56; }
.dia-fest { font-size: 8px; color: #BA7517; margin-top: 1px; }
.dia-cell.sel .dia-fest { color: rgba(255,255,255,0.7); }
.dia-titulo { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.dia-titulo span.titulo-text { font-size: 16px; font-weight: 500; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.badge-fest { background: #FAEEDA; color: #633806; }
.badge-alto { background: #FBEAF0; color: #72243E; }

.hora-bloque { margin-bottom: 10px; }
.hora-label { font-size: 12px; color: #999; font-weight: 500; margin-bottom: 6px; }
.slots-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { border-radius: 10px; padding: 10px 8px; cursor: pointer; border-width: 1.5px; border-style: solid; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; transition: transform 0.1s; background: #fff; user-select: none; }
.slot:hover:not(.slot-ocup) { transform: scale(1.03); }
.slot-ocup { cursor: default; opacity: 0.45; background: #f5f5f3 !important; border-color: #e0e0e0 !important; box-shadow: none !important; }
.slot-ico { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.slot-tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-top: 2px; }

.admin-wrap { max-width: 900px; margin: 0 auto; padding: 14px 14px 48px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid #d0d0cc; border-radius: 8px; padding: 7px 14px; font-size: 13px; color: #555; cursor: pointer; margin-bottom: 16px; font-family: inherit; }
.back-btn:hover { background: #f5f5f3; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 18px; }
.metric { background: #f5f5f3; border-radius: 10px; padding: 12px 14px; }
.metric-label { font-size: 11px; color: #666; margin-bottom: 4px; }
.metric-val { font-size: 20px; font-weight: 500; }
.filtros { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filtros input, .filtros select { font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; font-family: inherit; }
.limpiar-btn { font-size: 12px; padding: 6px 12px; border-radius: 7px; border: 1px solid #ccc; background: none; cursor: pointer; color: #666; font-family: inherit; }
.reservas-lista { display: flex; flex-direction: column; gap: 10px; }
.reserva-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; }
.reserva-card.cancelada { opacity: 0.5; }
.reserva-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.reserva-info { flex: 1; }
.reserva-badges { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.reserva-nombre { font-weight: 500; font-size: 14px; }
.badge-activa { background: #E1F5EE; color: #0F6E56; }
.badge-cancel { background: #f5f5f3; color: #999; }
.reserva-detalle { font-size: 12px; color: #666; line-height: 1.8; }
.comprobante-wrap { margin-top: 10px; }
.comprobante-lbl { font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
.comprobante-img { width: 100%; max-width: 320px; height: 180px; border-radius: 10px; border: 1px solid #e0e0e0; cursor: zoom-in; object-fit: cover; display: block; }
.comprobante-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
.sin-comprobante { margin-top: 8px; display: inline-flex; background: #FFF3CD; border-radius: 7px; padding: 4px 10px; font-size: 12px; color: #856404; }
.cancelar-btn { font-size: 12px; padding: 5px 12px; border-radius: 7px; border: 1px solid #A32D2D; color: #A32D2D; background: none; cursor: pointer; white-space: nowrap; font-family: inherit; flex-shrink: 0; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 360px; max-height: 92vh; overflow-y: auto; border: 1px solid #e8e8e5; }
.modal-hdr { padding: 20px 20px 0; }
.modal-hdr-row { display: flex; justify-content: space-between; align-items: flex-start; }
.modal-tag { font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
.modal-title { font-size: 17px; font-weight: 600; color: #1a1a1a; }
.modal-sub { font-size: 13px; color: #888; margin-top: 2px; }
.modal-close { background: #f5f5f3; border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; color: #888; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-div { height: 1px; background: #f0f0ed; margin: 16px 0 0; }
.modal-body { padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.precio-fila { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0f0ed; }
.precio-fila:last-child { border-bottom: none; }
.precio-lbl { font-size: 13px; color: #888; }
.precio-val { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.precio-val.verde { color: #0F6E56; }
.cuenta-box { background: #f5f5f3; border-radius: 10px; padding: 12px 14px; }
.cuenta-tit { font-size: 11px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
.cuenta-fila { display: flex; justify-content: space-between; margin-bottom: 4px; }
.cuenta-fila:last-child { margin-bottom: 0; }
.cuenta-key { font-size: 12px; color: #888; }
.cuenta-val { font-size: 13px; font-weight: 600; color: #1a1a1a; }
.field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 500; }
.field input { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; font-family: inherit; outline: none; transition: border 0.15s; }
.field input:focus { border-color: #1D9E75; }
.file-label { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px dashed #d0d0cc; border-radius: 10px; padding: 20px 12px; cursor: pointer; background: #fafafa; gap: 6px; }
.file-label.has-file { border-color: #1D9E75; background: #f5f5f3; padding: 12px; }
.preview-img { height: 80px; border-radius: 8px; object-fit: cover; }
.modal-btns { display: flex; gap: 8px; margin-top: 2px; }
.btn-ghost { background: none; border: 1px solid #d0d0cc; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; color: #666; flex: 1; font-family: inherit; }
.btn-primary { background: #0F6E56; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 500; cursor: pointer; flex: 2; font-family: inherit; }
.btn-primary:hover { background: #1D9E75; }

.pin-modal { max-width: 320px; overflow: hidden; }
.pin-hdr { background: #0F6E56; padding: 16px 18px; }
.pin-title { font-weight: 500; font-size: 16px; color: #fff; }
.pin-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.pin-body { padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.pin-error { font-size: 12px; color: #A32D2D; margin-top: 5px; display: none; }
.pin-btns { display: flex; gap: 10px; }
.pin-ghost { background: none; border: 1px solid #ccc; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; color: #666; flex: 1; font-family: inherit; }
.pin-primary { background: #0F6E56; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 500; cursor: pointer; flex: 1; font-family: inherit; }

.confirm-inner { background: #fff; border-radius: 14px; padding: 22px 20px; max-width: 300px; width: 100%; border: 1px solid #e0e0e0; }
.confirm-title { font-weight: 500; font-size: 15px; margin-bottom: 8px; }
.confirm-sub { font-size: 13px; color: #666; margin-bottom: 18px; }
.confirm-btns { display: flex; gap: 10px; }
.btn-danger { flex: 1; padding: 11px; border-radius: 10px; border: none; background: #A32D2D; color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; }

.img-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; cursor: zoom-out; }
.img-overlay img { max-width: 100%; max-height: 90vh; border-radius: 10px; }

.toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 13px; z-index: 9999; pointer-events: none; white-space: nowrap; display: none; }
.toast.ok { background: #0F6E56; }
.toast.err { background: #A32D2D; }
.empty { color: #999; font-size: 14px; }

@media (max-width: 500px) {
  .slots-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
        <!-- pelota fútbol -->
        <circle cx="20" cy="20" r="13" fill="#fff"/>
        <!-- pentágono central -->
        <polygon points="20,13 23.8,15.8 22.4,20.2 17.6,20.2 16.2,15.8" fill="#1a1a1a"/>
        <!-- pentágonos alrededor -->
        <polygon points="14,11 17.2,13.2 16.2,16.8 12,16.8 10.8,13" fill="#1a1a1a"/>
        <polygon points="26,11 29.2,13 28,16.8 23.8,16.8 22.8,13.2" fill="#1a1a1a"/>
        <polygon points="10.5,21.5 12,17 16,17.2 17.5,21.5 14,24.5" fill="#1a1a1a"/>
        <polygon points="29.5,21.5 26,24.5 22.5,21.5 24,17.2 28,17" fill="#1a1a1a"/>
        <polygon points="14,24.8 17.5,22 22.5,22 26,24.8 23.5,29 16.5,29" fill="#1a1a1a"/>
        <circle cx="20" cy="20" r="13" fill="none" stroke="#0F6E56" stroke-width="1"/>
      </svg>
      <div>
        <div class="header-title">Canchas Carnaval</div>
        <div class="header-sub">Sistema de reservas</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="tab-btn active" id="btnReservar" onclick="irCliente()">Reservar</button>
      <button class="tab-btn inactive" id="btnAdmin" onclick="irAdmin()">Administrar</button>
    </div>
  </div>
</div>

<div class="view active" id="viewCliente">
  <div class="cliente-wrap">
    <div class="cal-nav">
      <button class="nav-btn" onclick="semanaAnterior()">&#8249;</button>
      <span class="cal-mes" id="calMes"></span>
      <button class="nav-btn" onclick="semanaSiguiente()">&#8250;</button>
    </div>
    <div class="dias-grid" id="diasGrid"></div>
    <div class="dia-titulo" id="diaTitulo"></div>
    <div id="slotsContainer"></div>
  </div>
</div>

<div class="view" id="viewAdmin">
  <div class="admin-wrap">
    <button class="back-btn" onclick="irCliente()">&#8592; Volver a reservas</button>
    <div class="metrics" id="metrics"></div>
    <div class="filtros">
      <input type="date" id="filtroFecha" onchange="renderAdmin()" />
      <select id="filtroCancha" onchange="renderAdmin()">
        <option value="">Todas las canchas</option>
        <option value="1">Cancha 1</option>
        <option value="2">Cancha 2</option>
        <option value="3">Cancha 3</option>
        <option value="4">Cancha 4</option>
      </select>
      <button class="limpiar-btn" id="limpiarBtn" onclick="limpiarFiltros()" style="display:none">Limpiar</button>
    </div>
    <div class="reservas-lista" id="reservasLista"></div>
  </div>
</div>

<!-- PIN -->
<div class="overlay" id="overlayPin" style="display:none">
  <div class="modal pin-modal">
    <div class="pin-hdr">
      <div class="pin-title">Area administrativa</div>
      <div class="pin-sub">Ingresa la contrasena para continuar</div>
    </div>
    <div class="pin-body">
      <div class="field">
        <label>Contrasena</label>
        <input type="password" id="pinInput" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
          onkeydown="if(event.key==='Enter')confirmarPin()"
          oninput="document.getElementById('pinError').style.display='none'" />
        <div class="pin-error" id="pinError">Contrasena incorrecta.</div>
      </div>
      <div class="pin-btns">
        <button class="pin-ghost" onclick="cerrarPin()">Cancelar</button>
        <button class="pin-primary" onclick="confirmarPin()">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL RESERVA -->
<div class="overlay" id="overlayReserva" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-row">
        <div>
          <div class="modal-tag">Nueva reserva</div>
          <div class="modal-title" id="mTitulo"></div>
          <div class="modal-sub" id="mSub"></div>
        </div>
        <button class="modal-close" onclick="cerrarReserva()">&#215;</button>
      </div>
      <div class="modal-div"></div>
    </div>
    <div class="modal-body">
      <div id="mPrecios"></div>
      <div class="cuenta-box">
        <div class="cuenta-tit">Enviar abono a</div>
        <div class="cuenta-fila"><span class="cuenta-key">Llave</span><span class="cuenta-val">@BBMIM733</span></div>
        <div class="cuenta-fila"><span class="cuenta-key">Titular</span><span class="cuenta-val">MAYERLIS ILIAS MUNOZ</span></div>
      </div>
      <div class="field">
        <label>Nombre del cliente</label>
        <input type="text" id="mNombre" placeholder="Nombre completo" />
      </div>
      <div>
        <div style="font-size:12px;color:#666;font-weight:500;margin-bottom:6px">Comprobante de pago</div>
        <label class="file-label" id="fileLabel" for="fileInput">
          <span style="font-size:22px">&#128206;</span>
          <span style="font-size:13px;color:#666">Adjuntar captura del pago</span>
          <span style="font-size:11px;color:#bbb">Imagen o PDF</span>
        </label>
        <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none" onchange="handleFile(event)" />
      </div>
      <div class="modal-btns">
        <button class="btn-ghost" onclick="cerrarReserva()">Cancelar</button>
        <button class="btn-primary" onclick="confirmarReserva()">Confirmar reserva</button>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRM CANCELAR -->
<div class="overlay" id="overlayConfirm" style="display:none">
  <div class="confirm-inner">
    <div class="confirm-title">&#191;Cancelar esta reserva?</div>
    <div class="confirm-sub">Esta accion no se puede deshacer.</div>
    <div class="confirm-btns">
      <button class="btn-ghost" style="flex:1" onclick="cerrarConfirm()">Volver</button>
      <button class="btn-danger" onclick="ejecutarCancelacion()">Si, cancelar</button>
    </div>
  </div>
</div>

<!-- VER IMG -->
<div class="img-overlay" id="imgOverlay" style="display:none" onclick="cerrarImg()">
  <img id="imgOverlayEl" src="" alt="comprobante" />
</div>

<div class="toast" id="toast"></div>

<script>
const CANCHAS = [{id:1,nombre:"Cancha 1"},{id:2,nombre:"Cancha 2"},{id:3,nombre:"Cancha 3"},{id:4,nombre:"Cancha 4"}];
const HORARIOS = ["15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"];
const FESTIVOS = ["2025-01-01","2025-01-06","2025-03-24","2025-04-17","2025-04-18","2025-05-01","2025-06-02","2025-06-23","2025-06-30","2025-07-20","2025-08-07","2025-08-18","2025-10-13","2025-11-03","2025-11-17","2025-12-08","2025-12-25","2026-01-01","2026-01-12","2026-03-23","2026-04-02","2026-04-03","2026-05-01","2026-05-18","2026-06-08","2026-06-15","2026-06-29","2026-07-20","2026-08-07","2026-08-17","2026-10-12","2026-11-02","2026-11-16","2026-12-08","2026-12-25"];
const ADMIN_PASS = "Pipelas20061808";
const DIAS_CORTO = ["Lun","Mar","Mi\u00e9","Jue","Vie","S\u00e1b","Dom"];
const DIAS_ES = ["Lunes","Martes","Mi\u00e9rcoles","Jueves","Viernes","S\u00e1bado","Domingo"];
const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const C_COLORS = [
  {bg:"#E1F5EE",border:"#1D9E75",text:"#0F6E56",solid:"#1D9E75"},
  {bg:"#E6F1FB",border:"#185FA5",text:"#0C447C",solid:"#185FA5"},
  {bg:"#FAEEDA",border:"#BA7517",text:"#633806",solid:"#BA7517"},
  {bg:"#FBEAF0",border:"#993556",text:"#72243E",solid:"#993556"},
];

let reservas = [];
let diaActivo = todayStr();
let modalData = null;
let comprobanteUrl = null;
let confirmDeleteId = null;
let isAdmin = false;

try { const s = localStorage.getItem("cc_v3"); if(s) reservas = JSON.parse(s); } catch{}

function guardar(){ try{ localStorage.setItem("cc_v3", JSON.stringify(reservas)); }catch{} }
function todayStr(){ return new Date().toISOString().split("T")[0]; }
function addDays(base, n){ const d = new Date(base+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().split("T")[0]; }
function getDayIdx(d){ const w = new Date(d+"T12:00:00").getDay(); return w===0?6:w-1; }
function getLunes(d){ return addDays(d, -getDayIdx(d)); }
function getSemanaDias(base){ const l=getLunes(base); return Array.from({length:7},(_,i)=>addDays(l,i)); }
function esFestivo(d){ return FESTIVOS.includes(d); }
function esPrecioAlto(d){ const w=new Date(d+"T12:00:00").getDay(); return w===5||w===6||w===0||esFestivo(d); }
function getPrecio(cid,d){ return esPrecioAlto(d)?(cid===1?100000:70000):(cid===1?70000:55000); }
function fmt(n){ return "$"+Math.round(n).toLocaleString("es-CO"); }
function isOcupado(cid,fecha,hora){ return reservas.some(r=>r.canchaId===cid&&r.fecha===fecha&&r.hora===hora&&r.estado!=="cancelada"); }

function showToast(msg, tipo="ok"){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast "+tipo; t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; }, 3000);
}

function irCliente(){
  isAdmin = false;
  document.getElementById("viewCliente").classList.add("active");
  document.getElementById("viewAdmin").classList.remove("active");
  document.getElementById("btnReservar").className = "tab-btn active";
  document.getElementById("btnAdmin").className = "tab-btn inactive";
  renderCliente();
}

function irAdmin(){
  if(!isAdmin){
    document.getElementById("pinInput").value = "";
    document.getElementById("pinError").style.display = "none";
    document.getElementById("overlayPin").style.display = "flex";
    setTimeout(()=>document.getElementById("pinInput").focus(), 50);
  } else {
    renderAdmin();
  }
}

function confirmarPin(){
  if(document.getElementById("pinInput").value === ADMIN_PASS){
    isAdmin = true;
    document.getElementById("overlayPin").style.display = "none";
    document.getElementById("viewCliente").classList.remove("active");
    document.getElementById("viewAdmin").classList.add("active");
    document.getElementById("btnReservar").className = "tab-btn inactive";
    document.getElementById("btnAdmin").className = "tab-btn active";
    renderAdmin();
  } else {
    document.getElementById("pinError").style.display = "block";
  }
}
function cerrarPin(){ document.getElementById("overlayPin").style.display = "none"; }

function renderCliente(){
  const dias = getSemanaDias(diaActivo);
  const diaObj = new Date(diaActivo+"T12:00:00");
  document.getElementById("calMes").textContent = MESES_ES[new Date(dias[0]+"T12:00:00").getMonth()]+" "+new Date(dias[0]+"T12:00:00").getFullYear();

  const grid = document.getElementById("diasGrid");
  grid.innerHTML = "";
  dias.forEach((d,i)=>{
    const dObj2 = new Date(d+"T12:00:00");
    const sel = d===diaActivo, isH = d===todayStr(), fest = esFestivo(d);
    const cell = document.createElement("div");
    cell.className = "dia-cell"+(sel?" sel":isH?" hoy":"");
    cell.innerHTML = `<div class="dia-dow">${DIAS_CORTO[i]}</div><div class="dia-num">${dObj2.getDate()}</div>${fest?`<div class="dia-fest">fest</div>`:""}`;
    cell.onclick = ()=>{ diaActivo=d; renderCliente(); };
    grid.appendChild(cell);
  });

  const diaIdx = getDayIdx(diaActivo);
  const esAlto = esPrecioAlto(diaActivo), esFest = esFestivo(diaActivo);
  document.getElementById("diaTitulo").innerHTML = `
    <span class="titulo-text">${DIAS_ES[diaIdx]} ${diaObj.getDate()} de ${MESES_ES[diaObj.getMonth()]}</span>
    ${esFest?`<span class="badge badge-fest">Festivo</span>`:""}
    ${esAlto?`<span class="badge badge-alto">Tarifa especial</span>`:""}
  `;

  const container = document.getElementById("slotsContainer");
  container.innerHTML = "";
  HORARIOS.forEach(hora=>{
    const bloque = document.createElement("div");
    bloque.className = "hora-bloque";
    const fin = String(parseInt(hora)+1).padStart(2,"0")+":00";
    bloque.innerHTML = `<div class="hora-label">${hora} \u2013 ${fin}</div>`;
    const row = document.createElement("div");
    row.className = "slots-row";
    CANCHAS.forEach((c,ci)=>{
      const ocup = isOcupado(c.id, diaActivo, hora);
      const precio = getPrecio(c.id, diaActivo);
      const cl = C_COLORS[ci];
      const slot = document.createElement("div");
      slot.className = "slot"+(ocup?" slot-ocup":"");
      if(!ocup){ slot.style.borderColor=cl.border; slot.style.boxShadow="0 1px 6px rgba(0,0,0,0.07)"; }
      slot.innerHTML = `
        <div class="slot-ico" style="background:${ocup?"#e0e0e0":cl.bg};color:${ocup?"#999":cl.solid}">${c.id}</div>
        <div style="font-size:12px;font-weight:500;color:${ocup?"#999":"#1a1a1a"}">${c.nombre}</div>
        ${ocup
          ? `<div style="font-size:11px;color:#999">Ocupada</div>`
          : `<div style="font-size:13px;font-weight:500;color:${cl.solid}">${fmt(precio)}</div>
             <div class="slot-tag" style="color:${cl.text};background:${cl.bg}">Reservar</div>`}
      `;
      if(!ocup) slot.onclick = ()=>abrirReserva(c.id, hora);
      row.appendChild(slot);
    });
    bloque.appendChild(row);
    container.appendChild(bloque);
  });
}

function semanaAnterior(){ diaActivo=addDays(diaActivo,-7); renderCliente(); }
function semanaSiguiente(){ diaActivo=addDays(diaActivo,7); renderCliente(); }

function abrirReserva(cid, hora){
  const precio = getPrecio(cid, diaActivo);
  modalData = {canchaId:cid, fecha:diaActivo, hora, precio};
  comprobanteUrl = null;
  document.getElementById("mNombre").value = "";
  document.getElementById("fileInput").value = "";
  document.getElementById("mTitulo").textContent = CANCHAS.find(c=>c.id===cid).nombre;
  document.getElementById("mSub").textContent = diaActivo+" \u00b7 "+hora+"h";
  document.getElementById("mPrecios").innerHTML = `
    <div class="precio-fila"><span class="precio-lbl">Precio total</span><span class="precio-val">${fmt(precio)}</span></div>
    <div class="precio-fila"><span class="precio-lbl">Abono requerido</span><span class="precio-val verde">$10.000</span></div>
    <div class="precio-fila"><span class="precio-lbl">Saldo al llegar</span><span class="precio-val">${fmt(precio-10000)}</span></div>
  `;
  resetFile();
  document.getElementById("overlayReserva").style.display = "flex";
}
function cerrarReserva(){ document.getElementById("overlayReserva").style.display="none"; modalData=null; }

function resetFile(){
  comprobanteUrl = null;
  document.getElementById("fileLabel").className = "file-label";
  document.getElementById("fileLabel").innerHTML = `
    <span style="font-size:22px">&#128206;</span>
    <span style="font-size:13px;color:#666">Adjuntar captura del pago</span>
    <span style="font-size:11px;color:#bbb">Imagen o PDF</span>
  `;
}

function handleFile(e){
  const f = e.target.files[0]; if(!f) return;
  const url = URL.createObjectURL(f);
  comprobanteUrl = url;
  const lbl = document.getElementById("fileLabel");
  lbl.className = "file-label has-file";
  if(f.type.startsWith("image/")){
    lbl.innerHTML = `<img src="${url}" class="preview-img" /><span style="font-size:12px;color:#888">Toca para cambiar</span>`;
  } else {
    lbl.innerHTML = `<span style="font-size:22px">&#10003;</span><span style="font-size:13px;color:#666">${f.name}</span><span style="font-size:12px;color:#888">Toca para cambiar</span>`;
  }
}

function confirmarReserva(){
  const nombre = document.getElementById("mNombre").value.trim();
  if(!nombre){ showToast("Ingresa el nombre del cliente.","err"); return; }
  if(!comprobanteUrl){ showToast("Adjunta el comprobante de pago.","err"); return; }
  reservas.push({
    id: Date.now(), ...modalData, nombre, comprobanteUrl,
    abono:10000, saldo:modalData.precio-10000,
    estado:"activa", timestamp: new Date().toISOString()
  });
  guardar(); cerrarReserva(); renderCliente();
  showToast("\u00a1Reserva confirmada!");
}

function renderAdmin(){
  const ff = document.getElementById("filtroFecha").value;
  const fc = document.getElementById("filtroCancha").value;
  document.getElementById("limpiarBtn").style.display = (ff||fc)?"block":"none";

  const activas = reservas.filter(r=>r.estado==="activa");
  const totalAbonos = activas.reduce((s,r)=>s+r.abono,0);
  const totalSaldo = activas.reduce((s,r)=>s+r.saldo,0);

  document.getElementById("metrics").innerHTML = [
    {label:"Reservas activas", val:activas.length},
    {label:"Abonos recibidos", val:fmt(totalAbonos)},
    {label:"Saldo pendiente", val:fmt(totalSaldo)},
    {label:"Total esperado", val:fmt(totalAbonos+totalSaldo)},
  ].map(m=>`<div class="metric"><div class="metric-label">${m.label}</div><div class="metric-val">${m.val}</div></div>`).join("");

  const filtradas = reservas.filter(r=>{
    if(ff && r.fecha!==ff) return false;
    if(fc && r.canchaId!==parseInt(fc)) return false;
    return true;
  }).slice().reverse();

  const lista = document.getElementById("reservasLista");
  if(filtradas.length===0){ lista.innerHTML=`<p class="empty">No hay reservas registradas.</p>`; return; }

  lista.innerHTML = filtradas.map(r=>{
    const cl = C_COLORS[r.canchaId-1];
    const cn = CANCHAS.find(c=>c.id===r.canchaId)?.nombre||"";
    return `
      <div class="reserva-card${r.estado==="cancelada"?" cancelada":""}" style="border-left:4px solid ${cl.solid}">
        <div class="reserva-head">
          <div class="reserva-info">
            <div class="reserva-badges">
              <span class="reserva-nombre">${r.nombre}</span>
              <span class="badge ${r.estado==="activa"?"badge-activa":"badge-cancel"}">${r.estado}</span>
              <span class="badge" style="background:${cl.bg};color:${cl.text}">${cn}</span>
            </div>
            <div class="reserva-detalle">
              <div>${r.fecha} &middot; ${r.hora}h</div>
              <div>Total: <b>${fmt(r.precio)}</b> &middot; Abono: <b style="color:#0F6E56">${fmt(r.abono)}</b> &middot; Saldo: <b>${fmt(r.saldo)}</b></div>
            </div>
            ${r.comprobanteUrl
              ? `<div class="comprobante-wrap">
                   <div class="comprobante-lbl">Comprobante de pago</div>
                   <img src="${r.comprobanteUrl}" class="comprobante-img" onclick="verImg('${r.comprobanteUrl}')" />
                   <div class="comprobante-hint">Toca para ampliar</div>
                 </div>`
              : `<div class="sin-comprobante">Sin comprobante adjunto</div>`}
          </div>
          ${r.estado==="activa"?`<button class="cancelar-btn" onclick="pedirCancelar(${r.id})">Cancelar</button>`:""}
        </div>
      </div>
    `;
  }).join("");
}

function limpiarFiltros(){
  document.getElementById("filtroFecha").value="";
  document.getElementById("filtroCancha").value="";
  renderAdmin();
}

function pedirCancelar(id){
  confirmDeleteId=id;
  document.getElementById("overlayConfirm").style.display="flex";
}
function cerrarConfirm(){
  confirmDeleteId=null;
  document.getElementById("overlayConfirm").style.display="none";
}
function ejecutarCancelacion(){
  reservas = reservas.map(r=>r.id===confirmDeleteId?{...r,estado:"cancelada"}:r);
  guardar(); cerrarConfirm(); renderAdmin();
  showToast("Reserva cancelada.","err");
}

function verImg(url){
  document.getElementById("imgOverlayEl").src=url;
  document.getElementById("imgOverlay").style.display="flex";
}
function cerrarImg(){ document.getElementById("imgOverlay").style.display="none"; }

renderCliente();
</script>
</body>
</html>
